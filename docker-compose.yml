services:
  # App
  snippetsearcher-app:
    container_name: "snippetsearcher-app"
    restart: unless-stopped
    build: ../SnippetSearcher-App
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-app:${IMAGE_TAG:-develop}
    ports:
      - "19081:8080"
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_APP:-AppIngsis_dev}
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: appdb
      DB_HOST: appdb
      DB_PORT: 5432
      ACCESS_MANAGER_HOST: snippetsearcher-accessmanager
      ACCESS_MANAGER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUNNER_HOST: snippetsearcher-runner
      RUNNER_PORT: 8080
    depends_on:
      appdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      snippetsearcher-accessmanager:
        condition: service_started
      snippetsearcher-runner:
        condition: service_started
    networks:
      - reverse-proxy-network

  appdb:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - app-pgdata:/var/lib/postgresql/data
      - ./db/app-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "psql -U app -d appdb -c 'SELECT 1'" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reverse-proxy-network

  redis:
    container_name: "redis"
    restart: unless-stopped
    image: redis:7
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data
    networks:
      - reverse-proxy-network

  # Runner
  snippetsearcher-runner:
    container_name: "snippetsearcher-runner"
    restart: unless-stopped
    build:
      context: ../SnippetSearcher-Runner
      args:
        GITHUB_USER: EmmaBeni
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-runner:${IMAGE_TAG:-develop}
    ports:
      - "19082:8080"
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_RUNNER:-RunnerIngsis_dev}
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: snippet-db
      DB_HOST: runner-db
      DB_PORT: 5432
      BUCKET_SERVICE: asset-service
      BUCKET_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_HOST: snippetsearcher-app
      APP_PORT: 8080
    depends_on:
      - runner-db
      - asset-service
    networks:
      - reverse-proxy-network

  runner-db:
    container_name: "runner-db"
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: snippet-db
    volumes:
      - runner-pgdata:/var/lib/postgresql/data
      - ./db/runner-init:/docker-entrypoint-initdb.d
    networks:
      - reverse-proxy-network

  asset-service:
    container_name: "asset-service"
    restart: unless-stopped
    image: ghcr.io/austral-ingsis/snippet-asset-service:main.14
    ports:
      - "19084:8080"
    environment:
      AZURE_HOST: http://azurite
    depends_on:
      - azurite
    networks:
      - reverse-proxy-network

  azurite:
    container_name: "azurite"
    restart: unless-stopped
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - reverse-proxy-network

  # AccessManager
  snippetsearcher-accessmanager:
    container_name: "snippetsearcher-accessmanager"
    restart: unless-stopped
    build: ../SnippetSearcher-AccessManager
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-accessmanager:${IMAGE_TAG:-develop}
    ports:
      - "19083:8080"
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_ACCESS:-AccessManagerIngsis_dev}
      DB_USER: access_manager
      DB_PASSWORD: access_manager
      DB_NAME: compose-db
      DB_HOST: accessmanager-db
      DB_PORT: 5432
    depends_on:
      - accessmanager-db
    networks:
      - reverse-proxy-network

  accessmanager-db:
    container_name: "accessmanager-db"
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: access_manager
      POSTGRES_PASSWORD: access_manager
      POSTGRES_DB: compose-db
    volumes:
      - accessmanager-pgdata:/var/lib/postgresql/data
      - ./db/accessmanager-init:/docker-entrypoint-initdb.d
    networks:
      - reverse-proxy-network

  # UI
  snippetsearcher-ui:
    container_name: "snippetsearcher-ui"
    restart: unless-stopped
    build:
      context: ../printscript-ui
      args:
        - VITE_AUTH0_DOMAIN=dev-65tlgyzfpbzeka8a.us.auth0.com
        - VITE_AUTH0_CLIENT_ID=pDaLfxwVAerUnhjKfJNfxLfduUPJQi3x
        - VITE_AUTH0_AUDIENCE=https://api.snippets.com
        - VITE_AUTH0_REALM=User-Pass-Auth
        - VITE_FRONTEND_URL=http://localhost:5173
        - VITE_API_URL=http://localhost:19081
        - VITE_BACKEND_URL=http://localhost:19081
        - VITE_RUNNER_URL=http://localhost:19082
    image: ghcr.io/grupo-14-ingsis/printscript-ui:${IMAGE_TAG:-develop}
    ports:
      - "5173:80"
    environment:
      - APP_HOST=snippetsearcher-app
      - APP_PORT=8080
      - RUNNER_SERVICE=snippetsearcher-runner
      - RUNNER_PORT=8080

      - VITE_AUTH0_DOMAIN=dev-65tlgyzfpbzeka8a.us.auth0.com
      - VITE_AUTH0_CLIENT_ID=pDaLfxwVAerUnhjKfJNfxLfduUPJQi3x
      - VITE_AUTH0_AUDIENCE=https://api.snippets.com
      - VITE_AUTH0_REALM=Username-Password-Authentication

      - VITE_FRONTEND_URL=http://localhost:5173
      - VITE_API_URL=http://localhost:19081
      - VITE_BACKEND_URL=http://localhost:19081
      - VITE_RUNNER_URL=http://localhost:19082

    depends_on:
      - snippetsearcher-runner
    networks:
      - reverse-proxy-network

  # Reverse Proxy (Nginx)
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./reverse-proxy/nginx/conf.d/app.conf:/etc/nginx/templates/app.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - reverse-proxy-network
    command: /bin/sh -c "envsubst '$$DOMAIN_NAME' < /etc/nginx/templates/app.conf.template > /etc/nginx/conf.d/app.conf && nginx -g 'daemon off;'"
    depends_on:
      snippetsearcher-ui:
        condition: service_started
      snippetsearcher-app:
        condition: service_started
      snippetsearcher-runner:
        condition: service_started
      snippetsearcher-accessmanager:
        condition: service_started
      asset-service:
        condition: service_started

volumes:
  app-pgdata:
  redis-data:
  accessmanager-pgdata:
  runner-pgdata:
  azurite-data:

networks:
  reverse-proxy-network:
    name: reverse-proxy-network