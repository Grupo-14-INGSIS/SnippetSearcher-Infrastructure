version: '3.8'

# Healthcheck de los servicios Spring: Swarm solo les manda tráfico cuando el 8080 acepta
# conexiones, reemplaza las réplicas que dejan de responder y el rollback del update
# puede detectar una versión que no arranca. Sin esto, una réplica caída o arrancando
# figura "Running" y nginx devuelve 502. bash viene en eclipse-temurin, no hace falta curl.
x-spring-healthcheck: &spring-healthcheck
  test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
  interval: 10s
  timeout: 3s
  retries: 3
  # Al prender la VM arrancan todas las JVM a la vez y el App tardó ~5 min en abrir el 8080;
  # durante start_period los fallos no cuentan, así Swarm no lo mata en pleno arranque.
  start_period: 420s

# Política de reinicio de los servicios Spring: sin max_attempts, para que Swarm no se
# rinda si una dependencia (base, DNS) tarda en volver y el servicio quede caído.
x-spring-restart: &spring-restart
  condition: any
  delay: 10s

x-spring-update: &spring-update
  parallelism: 1
  delay: 10s
  order: start-first
  failure_action: rollback
  # Tiempo que Swarm vigila la tarea nueva antes de dar el update por bueno
  monitor: 60s

services:
  # -------------------------------------------------------------
  # App (4 réplicas con balanceo de carga interno Swarm)
  # -------------------------------------------------------------
  snippetsearcher-app:
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-app:${IMAGE_TAG:-develop}
    ports:
      - target: 8080
        published: 19081
        mode: ingress
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_APP:-AppIngsis_dev}
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: appdb
      DB_HOST: appdb
      DB_PORT: 5432
      ACCESS_MANAGER_HOST: snippetsearcher-accessmanager
      ACCESS_MANAGER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUNNER_HOST: snippetsearcher-runner
      RUNNER_PORT: 8080
    healthcheck: *spring-healthcheck
    deploy:
      replicas: 2
      restart_policy: *spring-restart
      update_config: *spring-update

  # -------------------------------------------------------------
  # Base de Datos App (1 réplica con persistencia de volumen)
  # -------------------------------------------------------------
  appdb:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - app-pgdata:/var/lib/postgresql/data
    # Script de init como config de Swarm (no bind mount): no necesita archivos en la VM
    configs:
      - source: app_init_sql
        target: /docker-entrypoint-initdb.d/01-init-snippet.sql
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # -------------------------------------------------------------
  # Redis: EXCLUSIVAMENTE Message Queue (Streams)
  # -------------------------------------------------------------
  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # -------------------------------------------------------------
  # Runner (2 réplicas con balanceo de carga interno Swarm)
  # La ejecución interactiva es stateless: el cliente manda los inputs
  # acumulados y el Runner re-ejecuta, así cualquier réplica puede atender.
  # -------------------------------------------------------------
  snippetsearcher-runner:
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-runner:${IMAGE_TAG:-develop}
    ports:
      - target: 8080
        published: 19082
        mode: ingress
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_RUNNER:-RunnerIngsis_dev}
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: snippet-db
      DB_HOST: runner-db
      DB_PORT: 5432
      BUCKET_SERVICE: asset-service
      BUCKET_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_HOST: snippetsearcher-app
      APP_PORT: 8080
    healthcheck: *spring-healthcheck
    deploy:
      replicas: 2
      restart_policy: *spring-restart
      update_config: *spring-update

  # -------------------------------------------------------------
  # Base de Datos Runner
  # -------------------------------------------------------------
  runner-db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: snippet-db
    volumes:
      - runner-pgdata:/var/lib/postgresql/data
    # db/runner-init está vacío: las tablas del Runner las crea Hibernate
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # -------------------------------------------------------------
  # Asset Service & Emulador Azurite
  # -------------------------------------------------------------
  asset-service:
    image: ghcr.io/austral-ingsis/snippet-asset-service:main.14
    ports:
      - target: 8080
        published: 19084
        mode: ingress
    environment:
      AZURE_HOST: http://azurite
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - target: 10000
        published: 10000
        mode: ingress
      - target: 10001
        published: 10001
        mode: ingress
      - target: 10002
        published: 10002
        mode: ingress
    volumes:
      - azurite-data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # -------------------------------------------------------------
  # AccessManager (4 réplicas con balanceo de carga interno Swarm)
  # -------------------------------------------------------------
  snippetsearcher-accessmanager:
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-accessmanager:${IMAGE_TAG:-develop}
    ports:
      - target: 8080
        published: 19083
        mode: ingress
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_ACCESS:-AccessManagerIngsis_dev}
      DB_USER: access_manager
      DB_PASSWORD: access_manager
      DB_NAME: compose-db
      DB_HOST: accessmanager-db
      DB_PORT: 5432
    healthcheck: *spring-healthcheck
    deploy:
      replicas: 2
      restart_policy: *spring-restart
      update_config: *spring-update

  # -------------------------------------------------------------
  # Base de Datos AccessManager
  # -------------------------------------------------------------
  accessmanager-db:
    image: postgres:16
    environment:
      POSTGRES_USER: access_manager
      POSTGRES_PASSWORD: access_manager
      POSTGRES_DB: compose-db
    volumes:
      - accessmanager-pgdata:/var/lib/postgresql/data
    configs:
      - source: accessmanager_init_sql
        target: /docker-entrypoint-initdb.d/01-init-accessmanager.sql
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # -------------------------------------------------------------
  # UI (4 réplicas con balanceo de carga interno Swarm)
  # -------------------------------------------------------------
  snippetsearcher-ui:
    image: ghcr.io/grupo-14-ingsis/printscript-ui:${IMAGE_TAG:-develop}
    ports:
      - target: 80
        published: 5173
        mode: ingress
    environment:
      - APP_HOST=snippetsearcher-app
      - APP_PORT=8080
      - RUNNER_SERVICE=snippetsearcher-runner
      - RUNNER_PORT=8080
      - VITE_AUTH0_DOMAIN=dev-65tlgyzfpbzeka8a.us.auth0.com
      - VITE_AUTH0_CLIENT_ID=pDaLfxwVAerUnhjKfJNfxLfduUPJQi3x
      - VITE_AUTH0_AUDIENCE=https://api.snippets.com
      - VITE_AUTH0_REALM=Username-Password-Authentication
      - VITE_FRONTEND_URL=http://localhost:5173
      - VITE_API_URL=http://localhost:19081
      - VITE_BACKEND_URL=http://localhost:19081
      - VITE_RUNNER_URL=http://localhost:19082
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  # -------------------------------------------------------------
  # Reverse Proxy (Nginx como Edge Gateway)
  # -------------------------------------------------------------
  reverse-proxy:
    image: nginx:alpine
    ports:
      - target: 80
        published: 80
        mode: ingress
      - target: 443
        published: 443
        mode: ingress
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:?DOMAIN_NAME es obligatorio (variable del environment de GitHub)}
    # La config de nginx viaja como config de Swarm. Los certificados siguen en el host:
    # /etc/letsencrypt es del sistema (certbot los renueva ahí), no del home.
    configs:
      - source: nginx_conf
        target: /etc/nginx/templates/app.conf.template
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: /bin/sh -c "envsubst '$$DOMAIN_NAME' < /etc/nginx/templates/app.conf.template > /etc/nginx/conf.d/app.conf && nginx -g 'daemon off;'"
    deploy:
      replicas: 1
      restart_policy:
        # "any" y no "on-failure": al apagar la VM nginx recibe SIGQUIT y sale con 0
        # ("Complete"); con on-failure Swarm no lo vuelve a levantar al reiniciar y
        # el sitio queda en ERR_CONNECTION_REFUSED aunque el resto del stack este up.
        condition: any
        delay: 5s

# -------------------------------------------------------------
# Volúmenes Persistentes
# -------------------------------------------------------------
volumes:
  app-pgdata:
  redis-data:
  accessmanager-pgdata:
  runner-pgdata:
  azurite-data:

# -------------------------------------------------------------
# Configs de Swarm: archivos del repo que antes se copiaban a la VM con scp y se montaban
# desde ~/. `docker stack deploy` los lee en el runner de Actions y los guarda en Swarm.
# Un config no se puede modificar: el nombre lleva el hash del contenido (lo calcula el
# workflow), así un cambio crea uno nuevo y, si el archivo no cambió, no se reinicia nada.
# -------------------------------------------------------------
configs:
  nginx_conf:
    name: nginx_conf_${NGINX_CONF_HASH:-local}
    file: ./reverse-proxy/nginx/conf.d/app.conf
  app_init_sql:
    name: app_init_${APP_INIT_HASH:-local}
    file: ./db/app-init/01-init-snippet.sql
  accessmanager_init_sql:
    name: accessmanager_init_${ACCESSMANAGER_INIT_HASH:-local}
    file: ./db/accessmanager-init/01-init-accessmanager.sql
