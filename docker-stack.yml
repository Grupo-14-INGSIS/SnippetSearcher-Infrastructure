version: '3.8'

# Healthcheck de los servicios Spring: Swarm solo les manda tráfico cuando el 8080 acepta
# conexiones, reemplaza las réplicas que dejan de responder y el rollback del update
# puede detectar una versión que no arranca. Sin esto, una réplica caída o arrancando
# figura "Running" y nginx devuelve 502. bash viene en eclipse-temurin, no hace falta curl.
x-spring-healthcheck: &spring-healthcheck
  test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
  interval: 10s
  timeout: 3s
  retries: 3
  # Al prender la VM arrancan las 6 JVM a la vez (2 App, 2 Runner, 2 AccessManager) sobre 2 CPUs
  # (load average ~28): con 420s el App no llegaba a abrir el 8080, Swarm lo mataba como
  # "unhealthy" (exit 137) y volvía a arrancar, en un ciclo que no terminaba. Durante
  # start_period los fallos no cuentan, así Swarm no lo mata en pleno arranque.
  start_period: 900s

# Opciones de la JVM de los servicios Spring. TieredStopAtLevel=1 usa solo el compilador JIT
# rápido (C1): arranca bastante antes y gasta mucha menos CPU al inicio, a cambio de algo menos
# de rendimiento una vez arrancada. Con 2 CPUs y 6 JVM arrancando juntas, compensa.
x-java-opts: &java-opts "-Djava.net.preferIPv4Stack=true -XX:TieredStopAtLevel=1"

# Política de reinicio de los servicios Spring: sin max_attempts, para que Swarm no se
# rinda si una dependencia (base, DNS) tarda en volver y el servicio quede caído.
x-spring-restart: &spring-restart
  condition: any
  delay: 10s

x-spring-update: &spring-update
  parallelism: 1
  delay: 10s
  order: start-first
  failure_action: rollback
  # Tiempo que Swarm vigila la tarea nueva antes de dar el update por bueno
  monitor: 60s

services:
  # -------------------------------------------------------------
  # App (2 réplicas con balanceo de carga interno Swarm)
  # -------------------------------------------------------------
  # Sin `ports`: igual que el resto de los servicios, solo se alcanza por la red interna del
  # stack. Desde afuera se entra únicamente por el reverse-proxy (80/443). Los puertos
  # 19081-19084 / 5173 / 10000-10002 quedan solo en docker-compose.yml (desarrollo local).
  snippetsearcher-app:
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-app:${IMAGE_TAG:-develop}
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_APP:-AppIngsis_dev}
      JAVA_TOOL_OPTIONS: *java-opts
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: appdb
      DB_HOST: appdb
      DB_PORT: 5432
      ACCESS_MANAGER_HOST: snippetsearcher-accessmanager
      ACCESS_MANAGER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUNNER_HOST: snippetsearcher-runner
      RUNNER_PORT: 8080
    healthcheck: *spring-healthcheck
    deploy:
      replicas: 2
      restart_policy: *spring-restart
      update_config: *spring-update

  # -------------------------------------------------------------
  # Base de Datos App (1 réplica con persistencia de volumen)
  # -------------------------------------------------------------
  appdb:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - app-pgdata:/var/lib/postgresql/data
    # Script de init como config de Swarm (no bind mount): no necesita archivos en la VM
    configs:
      - source: app_init_sql
        target: /docker-entrypoint-initdb.d/01-init-snippet.sql
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # -------------------------------------------------------------
  # Redis: EXCLUSIVAMENTE Message Queue (Streams)
  # -------------------------------------------------------------
  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # -------------------------------------------------------------
  # Runner (2 réplicas con balanceo de carga interno Swarm)
  # La ejecución interactiva es stateless: el cliente manda los inputs
  # acumulados y el Runner re-ejecuta, así cualquier réplica puede atender.
  # -------------------------------------------------------------
  snippetsearcher-runner:
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-runner:${IMAGE_TAG:-develop}
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_RUNNER:-RunnerIngsis_dev}
      JAVA_TOOL_OPTIONS: *java-opts
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: snippet-db
      DB_HOST: runner-db
      DB_PORT: 5432
      BUCKET_SERVICE: asset-service
      BUCKET_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_HOST: snippetsearcher-app
      APP_PORT: 8080
    healthcheck: *spring-healthcheck
    deploy:
      replicas: 2
      restart_policy: *spring-restart
      update_config: *spring-update

  # -------------------------------------------------------------
  # Base de Datos Runner
  # -------------------------------------------------------------
  runner-db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: snippet-db
    volumes:
      - runner-pgdata:/var/lib/postgresql/data
    # db/runner-init está vacío: las tablas del Runner las crea Hibernate
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # -------------------------------------------------------------
  # Asset Service & Emulador Azurite
  # -------------------------------------------------------------
  asset-service:
    image: ghcr.io/austral-ingsis/snippet-asset-service:main.14
    environment:
      AZURE_HOST: http://azurite
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    volumes:
      - azurite-data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # -------------------------------------------------------------
  # AccessManager (2 réplicas con balanceo de carga interno Swarm)
  # -------------------------------------------------------------
  snippetsearcher-accessmanager:
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-accessmanager:${IMAGE_TAG:-develop}
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_ACCESS:-AccessManagerIngsis_dev}
      JAVA_TOOL_OPTIONS: *java-opts
      DB_USER: access_manager
      DB_PASSWORD: access_manager
      DB_NAME: compose-db
      DB_HOST: accessmanager-db
      DB_PORT: 5432
    healthcheck: *spring-healthcheck
    deploy:
      replicas: 2
      restart_policy: *spring-restart
      update_config: *spring-update

  # -------------------------------------------------------------
  # Base de Datos AccessManager
  # -------------------------------------------------------------
  accessmanager-db:
    image: postgres:16
    environment:
      POSTGRES_USER: access_manager
      POSTGRES_PASSWORD: access_manager
      POSTGRES_DB: compose-db
    volumes:
      - accessmanager-pgdata:/var/lib/postgresql/data
    configs:
      - source: accessmanager_init_sql
        target: /docker-entrypoint-initdb.d/01-init-accessmanager.sql
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # -------------------------------------------------------------
  # UI (2 réplicas con balanceo de carga interno Swarm; es nginx, casi no consume CPU)
  # -------------------------------------------------------------
  snippetsearcher-ui:
    image: ghcr.io/grupo-14-ingsis/printscript-ui:${IMAGE_TAG:-develop}
    # Las VITE_* de abajo no tienen efecto en runtime (Vite las fija al compilar) y la UI, fuera
    # de localhost, llama a window.location.origin (/api, /runner): todo pasa por el reverse-proxy.
    environment:
      - APP_HOST=snippetsearcher-app
      - APP_PORT=8080
      - RUNNER_SERVICE=snippetsearcher-runner
      - RUNNER_PORT=8080
      - VITE_AUTH0_DOMAIN=dev-65tlgyzfpbzeka8a.us.auth0.com
      - VITE_AUTH0_CLIENT_ID=pDaLfxwVAerUnhjKfJNfxLfduUPJQi3x
      - VITE_AUTH0_AUDIENCE=https://api.snippets.com
      - VITE_AUTH0_REALM=Username-Password-Authentication
      - VITE_FRONTEND_URL=http://localhost:5173
      - VITE_API_URL=http://localhost:19081
      - VITE_BACKEND_URL=http://localhost:19081
      - VITE_RUNNER_URL=http://localhost:19082
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  # -------------------------------------------------------------
  # Reverse Proxy (Nginx como Edge Gateway)
  # -------------------------------------------------------------
  reverse-proxy:
    image: nginx:stable-alpine
    ports:
      - target: 80
        published: 80
        mode: ingress
      - target: 443
        published: 443
        mode: ingress
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:?DOMAIN_NAME es obligatorio (variable del environment de GitHub)}
    # La config de nginx viaja como config de Swarm. Los certificados están en /etc/letsencrypt
    # del host (del sistema, no del home): el servicio certbot los escribe y nginx los lee.
    configs:
      - source: nginx_conf
        target: /etc/nginx/templates/app.conf.template
      - source: nginx_50x_page
        target: /usr/share/nginx/html/errors/50x.html
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Tokens del desafío ACME: certbot los escribe y nginx los sirve en el puerto 80.
      # La carpeta tiene que existir en la VM antes del deploy (sudo mkdir -p /var/www/certbot).
      - /var/www/certbot:/var/www/certbot:ro
    # nginx lee el certificado solo al arrancar: cada 6 h hace `nginx -s reload` (sin cortar
    # conexiones) para tomar el que haya renovado certbot.
    command: >-
      /bin/sh -c "envsubst '$$DOMAIN_NAME' < /etc/nginx/templates/app.conf.template > /etc/nginx/conf.d/app.conf || exit 1;
      (while true; do sleep 21600; nginx -s reload; done) &
      exec nginx -g 'daemon off;'"
    deploy:
      replicas: 1
      restart_policy:
        # "any" y no "on-failure": al apagar la VM nginx recibe SIGQUIT y sale con 0
        # ("Complete"); con on-failure Swarm no lo vuelve a levantar al reiniciar y
        # el sitio queda en ERR_CONNECTION_REFUSED aunque el resto del stack este up.
        condition: any
        delay: 5s

  # -------------------------------------------------------------
  # Certbot: renueva el certificado de Let's Encrypt (modo webroot)
  # Cada 12 h corre `certbot renew`, que solo renueva si faltan menos de 30 días. Deja el token
  # del desafío en /var/www/certbot (lo sirve el reverse-proxy en el 80) y el certificado nuevo
  # en /etc/letsencrypt. El primer certificado se pide a mano una vez (ver HTTPS_NGINX_CORS.md).
  # -------------------------------------------------------------
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: >-
      /bin/sh -c "trap exit TERM;
      while true; do certbot renew --webroot -w /var/www/certbot; sleep 43200 & wait $${!}; done"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 30s

# -------------------------------------------------------------
# Volúmenes Persistentes
# -------------------------------------------------------------
volumes:
  app-pgdata:
  redis-data:
  accessmanager-pgdata:
  runner-pgdata:
  azurite-data:

# -------------------------------------------------------------
# Configs de Swarm: archivos del repo que antes se copiaban a la VM con scp y se montaban
# desde ~/. `docker stack deploy` los lee en el runner de Actions y los guarda en Swarm.
# Un config no se puede modificar: el nombre lleva el hash del contenido (lo calcula el
# workflow), así un cambio crea uno nuevo y, si el archivo no cambió, no se reinicia nada.
# -------------------------------------------------------------
configs:
  nginx_conf:
    name: nginx_conf_${NGINX_CONF_HASH:-local}
    file: ./reverse-proxy/nginx/conf.d/app.conf
  nginx_50x_page:
    name: nginx_50x_${NGINX_50X_HASH:-local}
    file: ./reverse-proxy/nginx/errors/50x.html
  app_init_sql:
    name: app_init_${APP_INIT_HASH:-local}
    file: ./db/app-init/01-init-snippet.sql
  accessmanager_init_sql:
    name: accessmanager_init_${ACCESSMANAGER_INIT_HASH:-local}
    file: ./db/accessmanager-init/01-init-accessmanager.sql
