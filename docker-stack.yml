version: '3.8'

services:
  reverse-proxy:
    image: nginx:stable-alpine
    ports:
      - { target: 80, published: 80, mode: ingress }
      - { target: 443, published: 443, mode: ingress }
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:?falta DOMAIN_NAME}
    configs:
      - { source: nginx_conf, target: /etc/nginx/templates/app.conf.template }
      - { source: nginx_50x_page, target: /usr/share/nginx/html/errors/50x.html }
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    # Toma el certificado renovado cada 6 h con `nginx -s reload` (sin cortar conexiones)
    command: >
      /bin/sh -c "envsubst '$$DOMAIN_NAME' < /etc/nginx/templates/app.conf.template > /etc/nginx/conf.d/app.conf || exit 1;
      (while true; do sleep 21600; nginx -s reload; done) &
      exec nginx -g 'daemon off;'"
    # El nombre del servicio en cada línea de log: así nginx-logs reconoce las de nginx
    logging:
      driver: json-file
      options: { labels: com.docker.swarm.service.name, max-size: 10m, max-file: "3" }
    networks: [snippetsearcher-net]
    # "any": al apagar la VM nginx sale con 0 y con on-failure Swarm no lo volvía a levantar
    deploy:
      restart_policy: { condition: any, delay: 5s }
      update_config: { failure_action: rollback }

  # Cola de mensajes (Redis Streams) de App y Runner
  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    networks: [snippetsearcher-net]
    deploy:
      update_config: { failure_action: rollback }

  # Lo usa el Runner (por snippetsearcher-net); habla con azurite por la red interna de infra
  asset-service:
    image: ghcr.io/austral-ingsis/snippet-asset-service:main.14
    environment:
      AZURE_HOST: http://azurite
    networks: [default, snippetsearcher-net]
    deploy:
      update_config: { failure_action: rollback }

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    volumes:
      - azurite-data:/data
    deploy:
      update_config: { failure_action: rollback }

  # Logs de nginx a New Relic (Fluent Bit)
  nginx-logs:
    image: fluent/fluent-bit:3.1.9
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      DOMAIN_NAME: ${DOMAIN_NAME}
    configs:
      - { source: fluentbit_conf, target: /fluent-bit/etc/fluent-bit.conf }
      - { source: fluentbit_parsers, target: /fluent-bit/etc/parsers-nr.conf }
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluentbit-state:/state
    deploy:
      resources: { limits: { memory: 64M } }
      update_config: { failure_action: rollback }

  # Renueva el certificado de Let's Encrypt cada 12 h (solo si faltan menos de 30 días)
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while true; do certbot renew --webroot -w /var/www/certbot; sleep 43200 & wait $${!}; done"
    deploy:
      update_config: { failure_action: rollback }

  # Vigía del DNS interno de Swarm. Después de un apagado de golpe, a veces un servicio queda corriendo
  # pero SIN nombre en el DNS; se repara recreando su tarea (`docker service update --force`).
  dns-watchdog:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint:
      - /bin/sh
      - -c
      - |
        SELF=infra_dns-watchdog
        mkdir -p /tmp/fails
        echo "[dns-watchdog] vigilando el DNS interno de todos los stacks"
        while true; do
          sleep 30
          for svc in $$(docker service ls --format '{{.Name}}'); do
            [ "$$svc" = "$$SELF" ] && continue
            # Está en la red host, no en la de Swarm: nunca resuelve por nombre y se lo recrearía sin fin
            [ "$$svc" = "infra_newrelic-infra" ] && continue
            # Solo réplicas listas: healthy, o sin healthcheck (bases, redis...). Una de Java en
            # "health: starting" todavía no está en el DNS: si se la contara, se recrearía en pleno arranque.
            c=$$(docker ps -q --filter label=com.docker.swarm.service.name=$$svc --filter health=healthy | head -n 1)
            [ -z "$$c" ] && c=$$(docker ps -q --filter label=com.docker.swarm.service.name=$$svc --filter health=none | head -n 1)
            [ -z "$$c" ] && continue
            docker exec "$$c" getent hosts localhost >/dev/null 2>&1 || continue
            # <stack>_<servicio> -> <servicio> (los nombres de stack no tienen "_")
            name=$${svc#*_}
            if docker exec "$$c" getent hosts "$$name" >/dev/null 2>&1; then
              rm -f "/tmp/fails/$$svc"
              continue
            fi
            n=$$(( $$(cat "/tmp/fails/$$svc" 2>/dev/null || echo 0) + 1 ))
            echo "$$n" > "/tmp/fails/$$svc"
            echo "[dns-watchdog] $$svc corre pero no resuelve por nombre ($$n/4)"
            if [ "$$n" -ge 4 ]; then
              echo "[dns-watchdog] recreando $$svc (docker service update --force)"
              docker service update --force --detach "$$svc" >/dev/null
              rm -f "/tmp/fails/$$svc"
            fi
          done
        done
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      update_config: { failure_action: rollback }
      resources:
        limits:
          memory: 64M

  # Métricas de la VM (CPU, RAM, disco, red, contenedores) en New Relic. Uno por nodo (global).
  # Swarm no aplica --privileged ni --pid=host: el agente lee la VM por /host.
  newrelic-infra:
    image: newrelic/infrastructure:2.0.1
    cap_add: [SYS_PTRACE]
    environment:
      NRIA_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      # Mismo nombre y atributo que el agente anterior: los dashboards y alertas filtran por environment
      NRIA_DISPLAY_NAME: ${NR_HOST}
      NRIA_CUSTOM_ATTRIBUTES: '{"environment":"${NR_ENVIRONMENT}"}'
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [hostnet]
    deploy:
      mode: global
      resources: { limits: { memory: 128M } }
      update_config: { failure_action: rollback }

# Red compartida entre stacks. `name` fijo: sin él se llamaría infra_snippetsearcher-net.
# hostnet: la red de la VM (la de newrelic-infra).
networks:
  snippetsearcher-net: { name: snippetsearcher-net, driver: overlay, attachable: true }
  hostnet: { external: true, name: host }

# `name` fijo = los volúmenes que ya existen del stack único. Sin `name` serían infra_redis-data, etc.: VACÍOS.
# fluentbit-state guarda hasta dónde leyó Fluent Bit: uno nuevo reenviaría todos los logs viejos.
volumes:
  redis-data: { name: snippetsearcher_redis-data }
  azurite-data: { name: snippetsearcher_azurite-data }
  fluentbit-state: { name: snippetsearcher_fluentbit-state }

# Un config de Swarm no se puede modificar: el nombre lleva el hash de reverse-proxy/ (CONFIG_HASH).
configs:
  nginx_conf: { name: "nginx_conf_${CONFIG_HASH:-local}", file: ./reverse-proxy/nginx/conf.d/app.conf }
  nginx_50x_page: { name: "nginx_50x_${CONFIG_HASH:-local}", file: ./reverse-proxy/nginx/errors/50x.html }
  fluentbit_conf: { name: "fluentbit_conf_${CONFIG_HASH:-local}", file: ./reverse-proxy/fluent-bit/fluent-bit.conf }
  fluentbit_parsers: { name: "fluentbit_parsers_${CONFIG_HASH:-local}", file: ./reverse-proxy/fluent-bit/parsers.conf }