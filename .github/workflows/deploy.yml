name: Deploy

  # Push a develop (VM de dev) o main (VM de prod), o Run workflow (poner la VM al día): despliega infra y
  # después los 4 servicios DE A UNO (2 CPUs no aguantan las JVM arrancando juntas). Cada servicio va con la
  # imagen del último commit de su rama (develop / production): si ya corre esa, no se reinicia.
  # Los .md no disparan nada.

on:
  push:
    branches: [develop, main]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  infra:
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    uses: ./.github/workflows/deploy-stack.yml
    with:
      stack: infra
      ambiente: ${{ github.ref_name == 'main' && 'PROD' || 'DEV' }}
    secrets: inherit
  servicios:
    needs: infra
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { stack: accessmanager, repo: SnippetSearcher-AccessManager, nr_prod: AccessManagerIngsis, nr_dev: AccessManagerIngsis_dev }
          - { stack: runner, repo: SnippetSearcher-Runner, nr_prod: RunnerIngsis, nr_dev: RunnerIngsis_dev }
          - { stack: app, repo: SnippetSearcher-App, nr_prod: AppIngsis, nr_dev: AppIngsis_dev }
          - { stack: ui, repo: printscript-ui }
    uses: ./.github/workflows/deploy-stack.yml
    with:
      stack: ${{ matrix.stack }}
      ambiente: ${{ github.ref_name == 'main' && 'PROD' || 'DEV' }}
      repo: Grupo-14-INGSIS/${{ matrix.repo }}
      ref: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
      nr_app: ${{ github.ref_name == 'main' && matrix.nr_prod || matrix.nr_dev }}   # ui: vacío
    secrets: inherit