name: Deploy Stack

# Despliega el stack completo de Swarm cuando hay un push a Infra. Corre desde el runner de Actions
# contra el Docker de la VM por SSH (contexto swarm-vm): docker-stack.yml, la config de nginx y
# los SQL de init se leen del checkout y viajan por la API de Docker. A la VM no se le copia ningún
# archivo y no necesita ~/.env. El login a GHCR se hace acá y --with-registry-auth se lo pasa a Swarm.
#
# Es idempotente: `docker stack deploy --resolve-image always` traduce cada tag de docker-stack.yml
# a su digest y solo actualiza los servicios cuya especificación cambió. Un commit automático de
# update-infra solo actualiza su servicio. Un commit humano también reinicia los microservicios,
# salvo que toque solo archivos .md.
#
# Si se pusheó con la VM apagada: al prenderla, Actions -> Deploy Stack -> Run workflow (rama
# develop o main) pone cada servicio en la versión anotada en docker-stack.yml.
#
# Este archivo es igual en develop y en main: esas ramas solo difieren en las líneas `image:` de
# docker-stack.yml. Ver Documentación/PIPELINE_CI_CD.md.

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    # Solo develop (dev) y main (prod); un run manual sobre otra rama no hace nada
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    # Un deploy del stack a la vez por ambiente
    concurrency:
      group: stack-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      STACK: snippetsearcher
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      # Para docker-stack.yml: App, Runner y AccessManager toman la clave de New Relic de acá (no del repo)
      NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      NEW_RELIC_APP_NAME_APP: ${{ vars.NEW_RELIC_APP_NAME_APP }}
      NEW_RELIC_APP_NAME_RUNNER: ${{ vars.NEW_RELIC_APP_NAME_RUNNER }}
      NEW_RELIC_APP_NAME_ACCESS: ${{ vars.NEW_RELIC_APP_NAME_ACCESS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # El paso que decide si se fuerza el redeploy lee los commits del push

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VM to known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Las imágenes son privadas: Swarm las baja con estas credenciales (--with-registry-auth)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Hash configs (a config of Swarm cannot be modified, so its name carries the content hash)
        run: |
          h() { sha256sum "$1" | cut -c1-12; }
          {
            echo "NGINX_CONF_HASH=$(h reverse-proxy/nginx/conf.d/app.conf)"
            echo "NGINX_50X_HASH=$(h reverse-proxy/nginx/errors/50x.html)"
            echo "APP_INIT_HASH=$(h db/app-init/01-init-snippet.sql)"
            echo "ACCESSMANAGER_INIT_HASH=$(h db/accessmanager-init/01-init-accessmanager.sql)"
          } >> "$GITHUB_ENV"

      - name: Create Docker context
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          docker context create swarm-vm \
            --docker "host=ssh://${SSH_USER}@${SSH_HOST}"

      - name: Deploy stack
        env:
          COMPOSE_FILE: docker-stack.yml
        run: |
          set -euo pipefail

          docker --context swarm-vm stack deploy \
            --with-registry-auth \
            --resolve-image always \
            --compose-file "$COMPOSE_FILE" \
            "$STACK"

      # Commit automático (update-infra): se actualiza solo el servicio cuya versión cambió.
      # Commit humano: también se reinician los microservicios, salvo que toque solo archivos .md.
      # Run workflow no fuerza nada: sirve para poner al día la VM después de prenderla.
      - name: Decide whether to force a redeploy
        id: redeploy
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          force=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Archivos que tocaron los commits humanos de este push
            files="$(
              for commit in $(git rev-list "$BEFORE..$GITHUB_SHA"); do
                [ "$(git log -1 --format=%an "$commit")" = "github-actions[bot]" ] && continue
                # core.quotepath=false: sin esto, Git escapa los acentos y "Documentación/x.md" no termina en .md
                git -c core.quotepath=false diff-tree --no-commit-id --name-only -r "$commit"
              done
            )"
            if printf '%s\n' "$files" | grep -v '^$' | grep -qvi '\.md$'; then
              force=true
            fi
          fi
          echo "force=$force" >> "$GITHUB_OUTPUT"
          echo "Forzar reinicio de los microservicios: $force"

      # De a un servicio y esperando a cada uno: 2 CPUs no alcanzan para arrancar todas las JVM a la vez.
      # Las bases, Redis y Azurite no se tocan. Con la misma imagen, la verificación de abajo no detecta
      # un rollback: si `service update` falla, el job termina en rojo acá.
      - name: Force redeploy of the microservices (human commit)
        if: steps.redeploy.outputs.force == 'true'
        run: |
          set -euo pipefail
          for svc in snippetsearcher-accessmanager snippetsearcher-runner snippetsearcher-app snippetsearcher-ui; do
            echo "Reiniciando $svc"
            docker --context swarm-vm service update --force --with-registry-auth "${STACK}_${svc}"
          done

      # `docker stack deploy` NO espera: le pide el cambio a Swarm y termina mientras la VM sigue bajando
      # las imágenes. Si un pull falla, Swarm rechaza la tarea ("No such image"), hace rollback y el
      # workflow terminaría en verde con la versión vieja. Acá se espera a que cada servicio propio corra
      # exactamente el digest de la imagen que pide docker-stack.yml; si hizo rollback, falla en rojo.
      - name: Verify every service runs the current image (fail on rollback)
        run: |
          expected() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          declare -A want
          for svc in snippetsearcher-app snippetsearcher-runner snippetsearcher-accessmanager snippetsearcher-ui; do
            repo="$svc"; [ "$svc" = "snippetsearcher-ui" ] && repo="printscript-ui"
            # La versión sale del stack: cada rama de Infra tiene las suyas (develop-<sha> / production-<sha>)
            image="$(grep -E "^[[:space:]]*image:[[:space:]]*ghcr\.io/grupo-14-ingsis/${repo}:" docker-stack.yml | awk '{print $2}')"
            digest="$(expected "$image")"
            if [ -z "$image" ] || [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "::error::No se pudo resolver la imagen de $svc en docker-stack.yml: '$image'"
              exit 1
            fi
            want[$svc]="$digest"
          done
          deadline=$((SECONDS + 2400))   # start_period de los Spring es 900s y el update va de a una réplica
          while :; do
            missing=""
            for svc in "${!want[@]}"; do
              # --no-trunc: sin él, docker service ps recorta el digest de la imagen y nunca coincidiría
              running="$(docker --context swarm-vm service ps "${STACK}_${svc}" --no-trunc --filter desired-state=running --format '{{.Image}} {{.CurrentState}}')"
              total="$(echo "$running" | grep -c . || true)"
              ok="$(echo "$running" | grep -F "${want[$svc]}" | grep -c '^.* Running' || true)"
              [ "$total" -gt 0 ] && [ "$ok" = "$total" ] || missing="$missing $svc"
            done
            [ -z "$missing" ] && { echo "Todos los servicios corren la imagen de docker-stack.yml"; break; }
            for svc in $missing; do
              st="$(docker --context swarm-vm service inspect "${STACK}_${svc}" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}')"
              if [ "$st" = "rollback_completed" ] || [ "$st" = "rollback_paused" ]; then
                echo "::error::$svc hizo rollback a la versión anterior. Tareas recientes:"
                docker --context swarm-vm service ps "${STACK}_${svc}" --no-trunc --format '{{.Image}} | {{.CurrentState}} | {{.Error}}' | head -n 6
                echo "::error::Si dice 'No such image', falló el pull en la VM. La causa real está en: sudo journalctl -u docker | grep 'pulling image failed'"
                exit 1
              fi
            done
            if [ $SECONDS -ge $deadline ]; then echo "::error::Timeout esperando:$missing"; exit 1; fi
            echo "Esperando:$missing"; sleep 20
          done

      # Recién ahora, con todas las imágenes ya bajadas y corriendo. Un `docker image prune` mientras la
      # VM baja una imagen borra las capas a medio extraer ("failed to Lchown ... no such file or
      # directory", "lease does not exist") y el pull falla: así fallaba el App y el Runner (imágenes
      # grandes, tardan más que la UI) cuando el prune venía justo después de `docker stack deploy`.
      - name: Clean up unused configs and images
        run: |
          # Los configs en uso no se pueden borrar: solo se van los de versiones anteriores
          docker --context swarm-vm config ls \
            --filter "label=com.docker.stack.namespace=$STACK" -q \
            | xargs -r docker --context swarm-vm config rm 2>/dev/null || true
          docker --context swarm-vm image prune -f || true

      # Métricas de la VM y de cada contenedor en New Relic, sin instalar nada en la VM. Va con `docker run`
      # y no en el stack porque necesita --privileged y --pid=host, y un servicio de Swarm no los aplica.
      # Solo se recrea si cambió la imagen o la configuración: la etiqueta config-hash lo detecta.
      - name: Ensure New Relic infrastructure agent
        env:
          NRIA_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NR_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
          NR_IMAGE: newrelic/infrastructure:2.0.1
        run: |
          set -euo pipefail
          if [ -z "$NRIA_LICENSE_KEY" ]; then
            echo "::warning::Falta el secret NEW_RELIC_LICENSE_KEY: no se despliega el agente de infraestructura"
            exit 0
          fi
          export NRIA_DISPLAY_NAME="${DOMAIN_NAME%%.*}"
          export NRIA_CUSTOM_ATTRIBUTES="{\"environment\":\"$NR_ENVIRONMENT\"}"
          config="$(printf '%s' "$NR_IMAGE|$NRIA_LICENSE_KEY|$NRIA_DISPLAY_NAME|$NRIA_CUSTOM_ATTRIBUTES" | sha256sum | cut -c1-12)"
          current="$(docker --context swarm-vm inspect newrelic-infra --format '{{.State.Running}} {{index .Config.Labels "config-hash"}}' 2>/dev/null || true)"
          if [ "$current" = "true $config" ]; then
            echo "El agente ya corre con esta configuración"
            exit 0
          fi
          docker --context swarm-vm rm -f newrelic-infra >/dev/null 2>&1 || true
          # -e sin valor: Docker toma la clave del entorno del runner y no queda en la línea de comandos
          docker --context swarm-vm run -d \
            --name newrelic-infra \
            --restart unless-stopped \
            --label "config-hash=$config" \
            --network=host \
            --cap-add=SYS_PTRACE \
            --privileged \
            --pid=host \
            --cgroupns=host \
            -v "/:/host:ro" \
            -v "/var/run/docker.sock:/var/run/docker.sock" \
            -e NRIA_LICENSE_KEY \
            -e NRIA_DISPLAY_NAME \
            -e NRIA_CUSTOM_ATTRIBUTES \
            "$NR_IMAGE"

      - name: Stack status
        run: docker --context swarm-vm stack services "$STACK"
