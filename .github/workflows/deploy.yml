name: Deploy Stack

# Despliega el stack completo de Swarm cuando hay un push a Infra. Corre desde el runner de Actions
# contra el Docker de la VM por SSH (DOCKER_HOST=ssh://...): docker-stack.yml, la config de nginx y
# los SQL de init se leen del checkout y viajan por la API de Docker. A la VM no se le copia ningún
# archivo y no necesita ~/.env. El login a GHCR se hace acá y --with-registry-auth se lo pasa a Swarm.
#
# Es idempotente: `docker stack deploy --resolve-image always` traduce cada tag (develop / production)
# a su digest actual y solo actualiza los servicios cuya especificación cambió. Un push que no cambia
# el stack (por ejemplo, de docs) no reinicia nada.
#
# Si se pusheó con la VM apagada: al prenderla, Actions -> Deploy Stack -> Run workflow (rama
# develop o main) trae todo lo último.

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    # Solo develop (dev) y main (prod); un run manual sobre otra rama no hace nada
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    # Un deploy del stack a la vez por ambiente
    concurrency:
      group: stack-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      STACK: snippetsearcher
      # Las ramas de Infra (develop / main) no se llaman igual que las de los microservicios
      # (develop / production): las imágenes de prod se publican como :production, no :main.
      IMAGE_TAG: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      NEW_RELIC_APP_NAME_APP: ${{ vars.NEW_RELIC_APP_NAME_APP }}
      NEW_RELIC_APP_NAME_RUNNER: ${{ vars.NEW_RELIC_APP_NAME_RUNNER }}
      NEW_RELIC_APP_NAME_ACCESS: ${{ vars.NEW_RELIC_APP_NAME_ACCESS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH to the VM
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_vm && chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 10 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vm
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_vm
            ConnectTimeout 15
            ServerAliveInterval 30
          EOF
          echo "DOCKER_HOST=ssh://vm" >> "$GITHUB_ENV"

      # Las imágenes son privadas: Swarm las baja con estas credenciales (--with-registry-auth)
      - name: Log in to GHCR (on the runner)
        run: echo "${{ secrets.PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

      - name: Hash configs (a config of Swarm cannot be modified, so its name carries the content hash)
        run: |
          h() { sha256sum "$1" | cut -c1-12; }
          {
            echo "NGINX_CONF_HASH=$(h reverse-proxy/nginx/conf.d/app.conf)"
            echo "NGINX_50X_HASH=$(h reverse-proxy/nginx/errors/50x.html)"
            echo "APP_INIT_HASH=$(h db/app-init/01-init-snippet.sql)"
            echo "ACCESSMANAGER_INIT_HASH=$(h db/accessmanager-init/01-init-accessmanager.sql)"
          } >> "$GITHUB_ENV"

      - name: Deploy stack
        run: |
          docker info --format 'Swarm: {{.Swarm.LocalNodeState}} en {{.Name}}'
          docker stack deploy --with-registry-auth --resolve-image always -c docker-stack.yml "$STACK"

      # `docker stack deploy` NO espera: le pide el cambio a Swarm y termina mientras la VM sigue bajando
      # las imágenes. Si un pull falla, Swarm rechaza la tarea ("No such image"), hace rollback y el
      # workflow terminaría en verde con la versión vieja. Acá se espera a que cada servicio propio corra
      # exactamente el digest que tiene hoy su tag; si hizo rollback, falla en rojo.
      - name: Verify every service runs the current image (fail on rollback)
        run: |
          expected() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          declare -A want
          for svc in snippetsearcher-app snippetsearcher-runner snippetsearcher-accessmanager snippetsearcher-ui; do
            repo="$svc"; [ "$svc" = "snippetsearcher-ui" ] && repo="printscript-ui"
            want[$svc]="$(expected "ghcr.io/grupo-14-ingsis/${repo}:${IMAGE_TAG}")"
          done
          deadline=$((SECONDS + 2400))   # start_period de los Spring es 900s y el update va de a una réplica
          while :; do
            missing=""
            for svc in "${!want[@]}"; do
              # --no-trunc: sin él, docker service ps recorta el digest de la imagen y nunca coincidiría
              running="$(docker service ps "${STACK}_${svc}" --no-trunc --filter desired-state=running --format '{{.Image}} {{.CurrentState}}')"
              total="$(echo "$running" | grep -c . || true)"
              ok="$(echo "$running" | grep -F "${want[$svc]}" | grep -c '^.* Running' || true)"
              [ "$total" -gt 0 ] && [ "$ok" = "$total" ] || missing="$missing $svc"
            done
            [ -z "$missing" ] && { echo "Todos los servicios corren la imagen actual de :$IMAGE_TAG"; break; }
            for svc in $missing; do
              st="$(docker service inspect "${STACK}_${svc}" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}')"
              if [ "$st" = "rollback_completed" ] || [ "$st" = "rollback_paused" ]; then
                echo "::error::$svc hizo rollback a la versión anterior. Tareas recientes:"
                docker service ps "${STACK}_${svc}" --no-trunc --format '{{.Image}} | {{.CurrentState}} | {{.Error}}' | head -n 6
                echo "::error::Si dice 'No such image', falló el pull en la VM. La causa real está en: sudo journalctl -u docker | grep 'pulling image failed'"
                exit 1
              fi
            done
            if [ $SECONDS -ge $deadline ]; then echo "::error::Timeout esperando:$missing"; exit 1; fi
            echo "Esperando:$missing"; sleep 20
          done

      # Recién ahora, con todas las imágenes ya bajadas y corriendo. Un `docker image prune` mientras la
      # VM baja una imagen borra las capas a medio extraer ("failed to Lchown ... no such file or
      # directory", "lease does not exist") y el pull falla: así fallaba el App y el Runner (imágenes
      # grandes, tardan más que la UI) cuando el prune venía justo después de `docker stack deploy`.
      - name: Clean up unused configs and images
        run: |
          # Los configs en uso no se pueden borrar: solo se van los de versiones anteriores
          docker config ls --filter "label=com.docker.stack.namespace=$STACK" -q | xargs -r docker config rm 2>/dev/null || true
          docker image prune -f || true

      - name: Stack status
        run: docker stack services "$STACK"
