name: Deploy Infrastructure on Change

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy Stack to ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy stack definition and nginx configs to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-stack.yml,reverse-proxy/**,db/**"
          target: "~/"

      - name: Deploy Swarm Stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_PAT,GHCR_USER
          script: |
            set -e
            cd ~
            
            # Cargar variables de entorno del host (~/.env)
            if [ -f .env ]; then
              set -a
              source .env 2>/dev/null || true
              set +a
            fi

            # Si el token no vino en .env, usar el del secret de Actions
            LOGIN_TOKEN="${GITHUB_TOKEN:-$GHCR_PAT}"
            LOGIN_USER="${GHCR_USER}"

            # Login en GitHub Container Registry
            echo "--- Logging into GHCR ---"
            echo "$LOGIN_TOKEN" | docker login ghcr.io -u "$LOGIN_USER" --password-stdin

            # Desplegar el stack completo en Docker Swarm
            echo "--- Deploying Stack: snippetsearcher ---"
            docker stack deploy --with-registry-auth -c docker-stack.yml snippetsearcher

            # Forzar actualización de todos los servicios para aplicar cambios de infra
            echo "--- Forcing update of services to reflect infra changes ---"
            docker service update --force snippetsearcher_snippetsearcher-app || true
            docker service update --force snippetsearcher_snippetsearcher-runner || true
            docker service update --force snippetsearcher_snippetsearcher-accessmanager || true
            docker service update --force snippetsearcher_snippetsearcher-ui || true
            docker service update --force snippetsearcher_reverse-proxy || true

            # Limpiar imágenes obsoletas
            docker image prune -f || true

            # Verificar estado de los servicios en el cluster
            echo "--- Verifying Stack Services ---"
            docker stack services snippetsearcher
