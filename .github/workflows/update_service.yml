name: Build & Deploy

permissions:
  contents: read

on:
  repository_dispatch:
    types: [new-image-ready]

# Un grupo por servicio: si se agrupa solo por ambiente, GitHub cancela ("superseded") los
# runs pendientes cuando llegan varios dispatches seguidos (app, runner y ui a la vez) y
# alguno de los servicios queda sin actualizar en la VM.
concurrency:
  group: deploy-${{ github.event.client_payload.environment }}-${{ github.event.client_payload.service }}
  cancel-in-progress: false

jobs:
  update:
    name: Deploy ${{ github.event.client_payload.service }} to ${{ github.event.client_payload.environment }}
    # El payload trae la rama del microservicio, que es también el tag de la imagen: develop o
    # production (en los microservicios la rama de prod es `production`; `main` quedó sin uso).
    # Coincide con el nombre del environment de GitHub. Cualquier otra rama se rechaza abajo.
    environment: ${{ github.event.client_payload.environment == 'production' && 'production' || 'develop' }}
    # Las ramas de features (caso9, 12y15, ...) también publican imagen y hacen dispatch: no se
    # despliegan (antes pisaban la VM de dev y creaban un environment por rama en GitHub)
    if: contains(fromJSON('["develop", "production"]'), github.event.client_payload.environment)
    runs-on: ubuntu-latest
    env:
      SERVICE_NAME: ${{ github.event.client_payload.service }}
      BRANCH: ${{ github.event.client_payload.environment }}
    steps:
      - name: Validate payload
        run: |
          case "$SERVICE_NAME" in
            snippetsearcher-app|snippetsearcher-runner|snippetsearcher-accessmanager|snippetsearcher-ui) ;;
            *) echo "::error::Servicio desconocido: '$SERVICE_NAME'"; exit 1 ;;
          esac

      - name: Set up SSH to the VM
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_vm && chmod 600 ~/.ssh/id_vm
          ssh-keyscan -T 10 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vm
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_vm
            ServerAliveInterval 30
          EOF

      - name: Log in to GHCR (on the runner)
        run: echo "${{ secrets.PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

      - name: Resolve the image digest
        id: image
        run: |
          IMAGE_REPO="$SERVICE_NAME"
          # El paquete de GHCR de la UI se llama distinto que el servicio de Swarm
          if [ "$SERVICE_NAME" = "snippetsearcher-ui" ]; then IMAGE_REPO="printscript-ui"; fi
          IMAGE_URI="ghcr.io/grupo-14-ingsis/${IMAGE_REPO}:${BRANCH}"
          # Se pinea el DIGEST y no el tag: si Swarm resolviera el tag, podría reutilizar la imagen
          # cacheada en el nodo y las réplicas quedarían con la versión vieja aunque el run sea verde.
          for attempt in 1 2 3; do
            DIGEST="$(docker buildx imagetools inspect "$IMAGE_URI" --format '{{json .Manifest}}' | jq -r .digest)" && [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ] && break
            if [ "$attempt" = 3 ]; then echo "::error::No se pudo resolver $IMAGE_URI"; exit 1; fi
            echo "Retry $attempt in 15s..."; sleep 15
          done
          echo "ref=ghcr.io/grupo-14-ingsis/${IMAGE_REPO}:${BRANCH}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Update the Swarm service
        env:
          DOCKER_HOST: ssh://vm
        run: |
          # El update espera a que las réplicas nuevas pasen el healthcheck (rollback si fallan)
          docker service update --with-registry-auth --image "${{ steps.image.outputs.ref }}" "snippetsearcher_${SERVICE_NAME}"
          docker service ps "snippetsearcher_${SERVICE_NAME}" --no-trunc --format '{{.Name}} {{.Image}} {{.CurrentState}}' | head -n 6
