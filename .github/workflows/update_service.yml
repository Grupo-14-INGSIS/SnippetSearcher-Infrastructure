name: Build & Deploy

permissions:
  contents: read
  packages: write

on:
  repository_dispatch:
    types: [new-image-ready]

concurrency:
  group: deploy-${{ github.event.client_payload.environment }}
  cancel-in-progress: false

jobs:
  update:
    name: Deploy to ${{ github.event.client_payload.environment }}
    environment: ${{ github.event.client_payload.environment }}
    runs-on: ubuntu-latest
    steps:

      - name: Get service and environment from payload
        id: payload
        run: |
          SERVICE_NAME="${{ github.event.client_payload.service }}"
          ENV_NAME="${{ github.event.client_payload.environment }}"
          
          if [ -z "$SERVICE_NAME" ] || [ -z "$ENV_NAME" ]; then
            echo "Error: Missing service or environment in payload"
            exit 1
          fi
          
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "environment_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "Received request to deploy service: $SERVICE_NAME to environment: $ENV_NAME"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVICE_NAME: ${{ steps.payload.outputs.service_name }}
          GHCR_PAT: ${{ secrets.PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          ENV_NAME: ${{ steps.payload.outputs.environment_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_PAT,GHCR_USER,SERVICE_NAME,ENV_NAME
          script: |
            set -e
            cd ~
            
            # Cargar variables del host si existen
            if [ -f .env ]; then
              set -a
              source .env 2>/dev/null || true
              set +a
            fi

            LOGIN_TOKEN="${GITHUB_TOKEN:-$GHCR_PAT}"
            LOGIN_USER="${GHCR_USER}"

            echo "--- Logging into GHCR ---"
            echo "$LOGIN_TOKEN" | docker login ghcr.io -u "$LOGIN_USER" --password-stdin

            # Actualizar quirúrgicamente solo este servicio en Docker Swarm
            # La imagen nueva se descarga y se aplica rolling update a las réplicas
            IMAGE_URI="ghcr.io/grupo-14-ingsis/${SERVICE_NAME}:${ENV_NAME}"
            SWARM_SERVICE="snippetsearcher_${SERVICE_NAME}"

            echo "--- Updating service ${SWARM_SERVICE} to ${IMAGE_URI} ---"
            docker service update --with-registry-auth --image "$IMAGE_URI" "$SWARM_SERVICE"

            # Limpiar imágenes viejas
            docker image prune -f || true
            
            # Verificar el estado de las réplicas del servicio actualizado
            docker service ps "$SWARM_SERVICE"