# Cada línea que escribe Docker: {"log": "...", "stream": "stdout", "time": "...", "attrs": {...}}
[PARSER]
    Name         docker
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S.%L
    Time_Keep    On

# El contenido de "log" cuando nginx escribe una línea de acceso (log_format nr_json)
[PARSER]
    Name    json
    Format  json
