# Fluent Bit: manda a New Relic los logs del reverse-proxy (nginx).
#
# Docker ya guarda la salida de cada contenedor en /var/lib/docker/containers/<id>/<id>-json.log.
# El servicio reverse-proxy agrega a cada línea su nombre de servicio de Swarm (opción `labels` del
# logging driver en docker-stack.yml): acá se leen todos los archivos y se descarta todo lo que no
# sea nginx. App, Runner y AccessManager ya mandan sus logs con el agente Java.
#
# Las variables ${...} las pone docker-stack.yml (vienen del environment de GitHub).

[SERVICE]
    Flush         5
    Log_Level     warn
    Parsers_File  /fluent-bit/etc/parsers-nr.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Tag               docker.*
    # Posición de lectura de cada archivo: al reiniciar no reenvía lo ya mandado
    DB                /state/flb.db
    Refresh_Interval  10
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

# Solo nginx
[FILTER]
    Name   grep
    Match  docker.*
    Regex  $attrs['com.docker.swarm.service.name'] reverse-proxy$

# Las líneas de acceso son JSON (log_format nr_json de app.conf): se separan en atributos
# (status, request_time, request_id...). Las de error son texto y quedan como están.
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name    modify
    Match   docker.*
    Rename  log message
    Remove  attrs
    Add     service nginx
    Add     domain ${DOMAIN_NAME}

# Log API de New Relic (cuenta de US). Mismo secret que usan los agentes.
[OUTPUT]
    Name              http
    Match             docker.*
    Host              log-api.newrelic.com
    Port              443
    URI               /log/v1
    Format            json
    Json_Date_Key     timestamp
    Json_Date_Format  epoch
    Header            X-License-Key ${NEW_RELIC_LICENSE_KEY}
    Compress          gzip
    tls               On
    tls.verify        On
    Retry_Limit       5
