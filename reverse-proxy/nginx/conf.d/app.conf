# Id de cada request: se respeta el X-Request-Id que venga (UI, Locust) y si no hay, nginx genera uno.
# Se le pasa a App, que lo usa en sus logs y se lo pasa a Runner y AccessManager: con el mismo id se
# sigue un request desde nginx hasta el último servicio.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Log de acceso en JSON: Fluent Bit lo manda a New Relic y cada campo queda como atributo
# (ver Documentación/NEW_RELIC.md). $uri y no $request_uri: no se loguean los query strings.
log_format nr_json escape=json
    '{"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
    '"body_bytes_sent":$body_bytes_sent,"request_length":$request_length,"request_time":$request_time,'
    '"upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time",'
    '"request_id":"$req_id","user_agent":"$http_user_agent"}';

# Puerto 80: desafío de Let's Encrypt y redirección a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN_NAME};
    access_log /dev/stdout nr_json;

    # certbot (modo webroot, en el host) deja el token en /var/www/certbot y Let's Encrypt lo
    # pide por HTTP. Sin esto el pedido se redirigía a HTTPS y la renovación fallaba.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás, a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN_NAME};
    access_log /dev/stdout nr_json;

    # Certificados de Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Los upstreams se resuelven en cada request con el DNS interno de Docker (127.0.0.11), no al
    # arrancar: con `proxy_pass http://snippetsearcher-app:8080` fijo, nginx no levantaba ("host not
    # found in upstream") mientras el App todavía no estaba en la red, por ejemplo al prender la VM.
    # Ahora nginx arranca enseguida y cada ruta responde 502 hasta que su servicio esté listo.
    # Para que nginx resuelva en runtime, proxy_pass tiene que usar una variable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Página propia cuando nginx no llega a un servicio (caído, arrancando o actualizándose).
    # `internal`: no se puede pedir /50x.html directamente.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html/errors;
        internal;
    }

    # UI - Frontend SPA
    location / {
        set $ui http://snippetsearcher-ui:80;
        proxy_pass $ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # AppIngsis - API Backend (/api/... llega tal cual)
    location /api/ {
        set $app http://snippetsearcher-app:8080;
        proxy_pass $app;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 600 s: guardar un snippet corre sus tests, y ejecuciones y tests pueden tardar
        proxy_read_timeout 600s;
    }

    # Runner y AccessManager NO se publican: no validan tokens, y solo App los llama por la red interna
    # de Swarm. Ninguno de los dos llama a App. Ver Documentación/SEGURIDAD.md.
}
