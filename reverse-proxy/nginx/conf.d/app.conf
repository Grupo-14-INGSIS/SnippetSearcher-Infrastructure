# Redirigir HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN_NAME};
    return 301 https://$host$request_uri;
}

# Servidor HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN_NAME};

    # Certificados de Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Los upstreams se resuelven en cada request con el DNS interno de Docker (127.0.0.11), no al
    # arrancar: con `proxy_pass http://snippetsearcher-app:8080` fijo, nginx no levantaba ("host not
    # found in upstream") mientras el App todavía no estaba en la red, por ejemplo al prender la VM.
    # Ahora nginx arranca enseguida y cada ruta responde 502 hasta que su servicio esté listo.
    # Para que nginx resuelva en runtime, proxy_pass tiene que usar una variable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # UI - Frontend SPA
    location / {
        set $ui http://snippetsearcher-ui:80;
        proxy_pass $ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # AppIngsis - API Backend (/api/... llega tal cual)
    location /api/ {
        set $app http://snippetsearcher-app:8080;
        proxy_pass $app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # RunnerIngsis - Motor de Ejecución (/runner/x -> /x en el Runner)
    location /runner/ {
        set $runner http://snippetsearcher-runner:8080;
        rewrite ^/runner/(.*)$ /$1 break;
        proxy_pass $runner;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }

    # AccessManagerIngsis - Permisos (/access/x -> /x en el AccessManager)
    location /access/ {
        set $access http://snippetsearcher-accessmanager:8080;
        rewrite ^/access/(.*)$ /$1 break;
        proxy_pass $access;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
