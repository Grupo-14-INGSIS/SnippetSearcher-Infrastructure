version: '3.8'

# Stack del frontend PrintScript UI (2 réplicas de nginx sirviendo el bundle estático).

services:
  snippetsearcher-ui:
    image: ghcr.io/grupo-14-ingsis/printscript-ui:develop-b19a293ab46dd6348b3ce4462f689c6e3853f423
    # Las VITE_* de abajo no tienen efecto en runtime (Vite las fija al compilar) y la UI, fuera
    # de localhost, llama a window.location.origin (/api): todo pasa por el reverse-proxy hacia App.
    environment:
      - VITE_AUTH0_DOMAIN=dev-65tlgyzfpbzeka8a.us.auth0.com
      - VITE_AUTH0_CLIENT_ID=pDaLfxwVAerUnhjKfJNfxLfduUPJQi3x
      - VITE_AUTH0_AUDIENCE=https://api.snippets.com
      - VITE_AUTH0_REALM=Username-Password-Authentication
      - VITE_FRONTEND_URL=http://localhost:5173
      - VITE_API_URL=http://localhost:19081
      - VITE_BACKEND_URL=http://localhost:19081
    networks:
      snippetsearcher-net:
        aliases:
          - snippetsearcher-ui
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

networks:
  snippetsearcher-net:
    external: true
