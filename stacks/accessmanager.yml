version: '3.8'

# Stack del servicio SnippetSearcher-AccessManager y su base de datos Postgres (`accessmanager-db`).

x-spring-healthcheck: &spring-healthcheck
  test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 900s

x-java-opts: &java-opts "-Djava.net.preferIPv4Stack=true -XX:TieredStopAtLevel=1"

x-spring-restart: &spring-restart
  condition: any
  delay: 10s

x-wait-for-db: &wait-for-db
  - bash
  - -c
  - |
    echo "[arranque] esperando a la base $$DB_HOST:$$DB_PORT"
    until bash -c "</dev/tcp/$$DB_HOST/$$DB_PORT" 2>/dev/null; do sleep 2; done
    echo "[arranque] base disponible, arranca la aplicación"
    sleep 5
    exec java -javaagent:/usr/local/newrelic/newrelic.jar -jar /app/app.jar

x-spring-update: &spring-update
  parallelism: 1
  delay: 10s
  order: start-first
  failure_action: rollback
  monitor: 60s

services:
  snippetsearcher-accessmanager:
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-accessmanager:develop-5d21e174978d871419481903eb14a96b2f4218a
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME_ACCESS:-AccessManagerIngsis_dev}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      JAVA_TOOL_OPTIONS: *java-opts
      DB_USER: access_manager
      DB_PASSWORD: access_manager
      DB_NAME: compose-db
      DB_HOST: accessmanager-db
      DB_PORT: 5432
    entrypoint: *wait-for-db
    healthcheck: *spring-healthcheck
    networks:
      default:
      snippetsearcher-net:
        aliases:
          - snippetsearcher-accessmanager
    deploy:
      replicas: 2
      restart_policy: *spring-restart
      update_config: *spring-update

  accessmanager-db:
    image: postgres:16
    environment:
      POSTGRES_USER: access_manager
      POSTGRES_PASSWORD: access_manager
      POSTGRES_DB: compose-db
    volumes:
      - accessmanager-pgdata:/var/lib/postgresql/data
    configs:
      - source: accessmanager_init_sql
        target: /docker-entrypoint-initdb.d/01-init-accessmanager.sql
    networks:
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  accessmanager-pgdata:
    external: true
    name: snippetsearcher_accessmanager-pgdata

configs:
  accessmanager_init_sql:
    name: accessmanager_init_${ACCESSMANAGER_INIT_HASH:-local}
    file: ../db/accessmanager-init/01-init-accessmanager.sql

networks:
  default:
  snippetsearcher-net:
    external: true
